# Workflow to build and test crab dev branch 

name: CI-dev

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the dev branch
  push:
    branches: dev
  pull_request:
    branches: dev

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "test"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Each configuration runs on its own fresh runner so the five builds do not
    # share (and exhaust) a single runner's disk.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: crab without external libraries
            dockerfile: docker/crab.dev.Dockerfile
            tag: seahorn/crab
          - name: crab+apron+ldd-boxes
            dockerfile: docker/crab.dev.apron.Dockerfile
            tag: seahorn/crab_apron_boxes
          - name: crab+elina
            dockerfile: docker/crab.dev.elina.Dockerfile
            tag: seahorn/crab_elina
          - name: crab+pplite (apron interface)
            dockerfile: docker/crab.dev.pplite.Dockerfile
            tag: seahorn/crab_pplite
          - name: crab+pplite (native interface)
            dockerfile: docker/crab.dev.pplite_native.Dockerfile
            tag: seahorn/crab_pplite_native

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out Repo
        uses: actions/checkout@v2
        with:
          ref: dev
      - name: Build ${{ matrix.name }} and run tests
        run: docker build --build-arg BUILD_TYPE=Release -t ${{ matrix.tag }} -f ${{ matrix.dockerfile }} .
